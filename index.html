<!doctype html>
<html lang="en">
  <head>
    <title>Puff Puff Pass</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  
    <meta name="description" content="Puff Puff Pass Website" />
    <meta name="author" content="Ricardo Rivera" />
    <meta name="keywords" content="Puff Puff Pass" />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="icon" href="media/Icons/shop.svg" type="image/svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script>
      // injected by Code.gs (doGet?token=...)
      window.PPP_SESSION = {
        token: "<?= PPP_TOKEN ?>",
        user: "<?= PPP_USER ?>",
        display: "<?= PPP_DISPLAY ?>"
      };
  </script>

  </head>

  <body>
    <!-- ✅ background layer that stays after age gate closes -->
    <div id="site-bg" aria-hidden="true"></div>

        <!-- age verification -->
        <div
          id="age-gate"
          aria-modal="true"
          role="dialog"
          aria-labelledby="age-title"
          aria-describedby="age-desc"
        >
          <div class="age-gate-box">
            <h2 id="age-title" class="age-gate-title">Puff Puff Pass Job Application</h2>
            <h3 id="age-verification">Are you at least 21-years old?</h3>
            <p id="age-desc" class="age-gate-desc">
              This job requires handling cannabis. Please confirm your age before applying.
            </p>

            <div class="age-gate-buttons">
              <button id="age-yes" type="button">Yes, I am 21+</button>
              <button id="age-no" type="button">No</button>
            </div>
            <!-- employee portal + popup script -->
            <div class="employees">
              <button id="employee-section" type="button">Employee Portal</button>
              <script>
               function createPopup(message) {
                const popup = document.createElement("div");
                let ageGate = document.getElementById("age-gate");
                ageGate.style.display = "none";
                popup.className = 'popup';
                popup.textContent = message;
                popup.style.position = "fixed";
                popup.style.top = "45%";
                popup.style.left = "50%";
                popup.style.transform = "translate(-50%, -50%)";
                popup.style.padding = "10px";
                popup.style.backgroundColor = "orangered";
                popup.style.border = "1px solid black";
                popup.style.boxShadow = "0 0 10px rgba(0, 0, 0, 0.5)";
                popup.style.zIndex = "9999";
                document.body.appendChild(popup);
                return popup;   
            }
              function showPopup(message) {
                  const popup = createPopup(message);
                  setTimeout(function() {
                      popup.remove();
                  }, 
                  3850);
              }
              document.addEventListener("DOMContentLoaded", () => {
                const GAS_URL = "https://script.google.com/macros/s/AKfycbyTxZJkM7LrVOhBHLTNrcSYWnx-ww4t2Dktgo3Uj7oveAG6TIXTv0PhHLMofqi9-xmx/exec";

                const btn = document.getElementById("employee-section");
                if (!btn) return;

                btn.addEventListener("click", (e) => {
                  e.preventDefault();
                  // optional popup delay
                  showPopup("You will be prompted to login shortly, please standby!");
                  setTimeout(() => window.location.href = GAS_URL, 4000);
                  window.location.href = GAS_URL;
                });
              });

              </script>
              
            </div>
          </div>
        </div>
        <!-- ✅ end of age verification -->
        <!-- underage / access denied -->
        <div
          id="underage-gate"
          aria-modal="true"
          role="dialog"
          aria-labelledby="underage-title"
          aria-describedby="underage-desc"
        >
          <div class="age-gate-box">
            <h2 id="underage-title" class="age-gate-title">Access Denied</h2>
            <h3 id="underage-verification">You are not old enough to access this website.</h3>

            <p id="underage-desc" class="age-gate-desc">
              You must be 21 or older to continue. Please exit the site.
            </p>

            <div class="age-gate-buttons">
              <button id="underage-back" type="button">Go Back</button>
              <button id="underage-leave" type="button">Leave Site</button>
            </div>
          </div>
        </div>
        <!-- end underage / access denied -->


          
    <!-- Job Application Embed -->
    <section id="Puff_Puff_Application">
      <div class="app-shell">
        <iframe
          src="https://docs.google.com/forms/d/e/1FAIpQLSdfSTNDCnUnrr_Ahc-lrYCR6H03XDWvLGiC45-46lL692XX6g/viewform?embedded=true"
          
          frameborder="0"
          marginheight="0"
          marginwidth="0"
          >Loading…</iframe
        >
      </div>
    </section>
  
      
  </body>
<script src="scripts/landing_page.js" defer></script>
</html>
