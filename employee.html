<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee Portal</title>
  <style>
    html, body { height: 100%; margin: 0; background:#111; }
    #msg { color:#eee; font-family: Arial; padding: 16px; }
    .btn {
      display:inline-block; padding:12px 16px; border-radius:10px;
      background:orangered; color:#111; font-weight:800; text-decoration:none;
      border:0; cursor:pointer;
    }
  </style>
</head>
<body>
  <div id="msg">Loading…</div>

  <form id="postForm" method="POST" style="display:none;">
    <input type="hidden" name="token" id="tokenField" value="">
  </form>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzl_MwzGuQgU0RyM4zMPcXVjcnn9fvu4MhB33MNp6XYy6sLo20kRbuMCvs0o2oN6Hk/exec";

    function getTokenFromHash() {
      const m = location.hash.match(/token=([^&]+)/);
      return m ? decodeURIComponent(m[1]) : null;
    }

    const msg = document.getElementById("msg");
    const form = document.getElementById("postForm");
    const tokenField = document.getElementById("tokenField");

    const token = getTokenFromHash() || sessionStorage.getItem("ppp_token");

    if (!token) {
      msg.textContent = "No session found. Redirecting to login…";
      window.location.replace(GAS_URL);
    } else {
      sessionStorage.setItem("ppp_token", token);
      history.replaceState(null, "", location.pathname + location.search); // remove #token

      // POST the token (PRIVATE: not shown in URL)
      tokenField.value = token;
      form.action = GAS_URL;
      form.submit();

      // fallback UI if blocked
      setTimeout(() => {
        msg.innerHTML = `
          <div style="max-width:640px;margin:24px auto;background:#111;color:#eee;padding:18px;border-radius:14px;font-family:Arial;">
            <h2 style="margin:0 0 10px;">Continue to POS</h2>
            <p style="margin:0 0 16px;opacity:.85;">If nothing happened, click below.</p>
            <button class="btn" onclick="document.getElementById('postForm').submit()">Open POS</button>
          </div>
        `;
      }, 1200);
    }
  </script>
</body>
</html>
