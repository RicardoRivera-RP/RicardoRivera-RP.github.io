<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee Portal</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#111; color:#eee; padding:16px; }
    button { padding:10px 14px; border-radius:10px; border:0; cursor:pointer; font-weight:700; }
    .muted { color:#aaa; font-size:12px; }
  </style>
</head>
<body>
  <div id="msg">Loading…</div>
  <button id="reset" style="display:none;">Reset session</button>
  <div id="dbg" class="muted"></div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxwLa7iS2NO2UlnWcRo9y4bX2CLMXBiUVrSp5grw2LCrpNaM85C13aOBxDZKY4SGec0/exec";

    function getToken() {
      const hash = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
      return new URLSearchParams(hash).get("token");
    }

    const msg = document.getElementById("msg");
    const resetBtn = document.getElementById("reset");
    const dbg = document.getElementById("dbg");

    resetBtn.onclick = () => {
      sessionStorage.removeItem("ppp_token");
      location.replace(location.pathname);
    };

    const token = getToken() || sessionStorage.getItem("ppp_token");
    dbg.textContent = token ? ("token length: " + token.length) : "no token";

    if (!token) {
      resetBtn.style.display = "inline-block";
      msg.textContent = "No session found. Redirecting to login…";
      window.location.replace(GAS_URL);
    } else {
      sessionStorage.setItem("ppp_token", token);
      history.replaceState(null, "", location.pathname + location.search);

      msg.textContent = "Opening POS…";
      // ✅ redirect to webapp (no iframe)
      window.location.replace(GAS_URL + "?token=" + encodeURIComponent(token));
    }
  </script>
</body>
</html>
