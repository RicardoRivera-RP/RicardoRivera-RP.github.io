<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee Portal</title>
  <style>
    html, body { height: 100%; margin: 0; background:#111; }
    #posFrame { width: 100%; height: 100vh; border: 0; display:none; }
    #msg { color:#eee; font-family: Arial; padding: 16px; }
  </style>
</head>
<body>
  <div id="msg">Loading…</div>
  <iframe id="posFrame" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwbGDRRnyfLjiM_rYySLL5bXkbn7-LdlnFGcmJTLz1-H4RX4rdLzNVQqI9ND-U39h38/exec";

    function getTokenFromHash() {
      const m = location.hash.match(/token=([^&]+)/);
      return m ? decodeURIComponent(m[1]) : null;
    }

    const msg = document.getElementById("msg");
    const frame = document.getElementById("posFrame");

    const token = getTokenFromHash() || sessionStorage.getItem("ppp_token");

    if (!token) {
      msg.textContent = "No session found. Redirecting to login…";
      window.location.replace(GAS_URL);
    } else {
      sessionStorage.setItem("ppp_token", token);
      // remove the #token from the URL
      history.replaceState(null, "", location.pathname + location.search);

      frame.style.display = "flex";
      frame.src = GAS_URL + "?token=" + encodeURIComponent(token);


      msg.textContent = "Loading POS…";
    }
  </script>
</body>
</html>
