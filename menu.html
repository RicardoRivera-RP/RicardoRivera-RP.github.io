<!doctype html>
<html lang="en">
  <head>
    <title>Puff Puff Pass</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  
    <meta name="description" content="Puff Puff Pass Website" />
    <meta name="author" content="Ricardo Rivera" />
    <meta name="keywords" content="Puff Puff Pass" />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="icon" href="media/Icons/shop.svg" type="image/svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />

  </head>
  <body>
    
<section id="Dispensary_Menu">
  <div class="menu-shell">
    <header class="menu-header">
      <div class="menu-header-left">
        <h1 class="menu-title">Puff Puff Pass Dispensary Menu</h1>
        <p class="menu-subtitle">For Viewing Purposes Only</p>
      </div>

      <button id="menu-back" class="menu-back" type="button">Back</button>
    </header>

    <div class="menu-controls">
      <label class="menu-search" aria-label="Search products">
        <span class="sr-only">Search</span>
        <input id="menu-search" type="search" placeholder="Search strain, brand, effect…" />
      </label>

      <select id="menu-sort" class="menu-sort" aria-label="Sort products">
        <option value="featured">Sort: Featured</option>
        <option value="price_asc">Sort: Price (Low → High)</option>
        <option value="price_desc">Sort: Price (High → Low)</option>
        <option value="thc_desc">Sort: Potency (High → Low)</option>
        <option value="name_asc">Sort: Name (A → Z)</option>
      </select>
    </div>

    <nav class="menu-chips" aria-label="Menu categories">
      <button class="chip is-active" data-cat="All" type="button">All</button>
      <button class="chip" data-cat="Flower" type="button">Flower</button>
      <button class="chip" data-cat="Pre-Rolls" type="button">Pre-Rolls</button>
      <button class="chip" data-cat="Vapes" type="button">Vapes</button>
      <button class="chip" data-cat="Edibles" type="button">Edibles</button>
      <button class="chip" data-cat="Concentrates" type="button">Concentrates</button>
      <button class="chip" data-cat="Topicals" type="button">Topicals</button>
      <button class="chip" data-cat="Tinctures" type="button">Tinctures</button>
      <button class="chip" data-cat="Accessories" type="button">Accessories</button>
    </nav>

    <div class="menu-grid" id="menu-grid">
      <!-- Example cards (you can delete these once you render from JS) -->
      <article class="menu-card" data-cat="Flower" data-thc="30.62" data-price="30" data-name="Acapulco Gold">
        <div class="menu-card-top">
          <span class="tag tag-cat">Flower</span>
          <span class="tag tag-type sativa">Sativa</span>
        </div>
        <h3 class="menu-card-name">Acapulco Gold</h3>
        <p class="menu-card-brand">Back Home Cannabis Co.</p>
        <div class="menu-card-meta">
          <span>1/8 oz</span>
          <span>THC 30.62%</span>
        </div>
        <div class="menu-card-bottom">
          <div class="menu-price">$30</div>
          <button class="menu-add" type="button">Add</button>
        </div>
      </article>

      <article class="menu-card" data-cat="Pre-Rolls" data-thc="25.3" data-price="38" data-name="Grand Daddy Purple Doobies">
        <div class="menu-card-top">
          <span class="tag tag-cat">Pre-Rolls</span>
          <span class="tag tag-type indica">Indica</span>
        </div>
        <h3 class="menu-card-name">Grand Daddy Purple Doobies</h3>
        <p class="menu-card-brand">Ruby Farms</p>
        <div class="menu-card-meta">
          <span>7-pack</span>
          <span>THC 25.3%</span>
        </div>
        <div class="menu-card-bottom">
          <div class="menu-price">$38</div>
          <button class="menu-add" type="button">Add</button>
        </div>
      </article>
    </div>

    <p class="menu-footnote">
      For adults 21+ only. Keep out of reach of children. (RP/in-game menu display.)
    </p>
  </div>
</section>


    
  </body>
</html>
